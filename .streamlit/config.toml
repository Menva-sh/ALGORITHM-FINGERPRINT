[browser]
gatherUsageStats = false

# Light theme in the style of The Original Green: off-white page, near-black ink, white cards,
# one cream accent. Cards, pills and labels are styled in app/ui.py.
[theme]
base = "light"
primaryColor = "#080808"
backgroundColor = "#F8F8F8"
secondaryBackgroundColor = "#E8E8E8"
textColor = "#080808"
borderColor = "#C8C8C8"
linkColor = "#4E5A36"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [500, 500, 500]
headingFontSizes = ["30px", "16px", "14px"]
baseFontSize = 14
baseRadius = "medium"
showWidgetBorder = true
