[browser]
gatherUsageStats = false

# Light theme from the redesign mock-ups: grey page, white panels, dark navy sidebar.
[theme]
base = "light"
primaryColor = "#1B2230"
backgroundColor = "#EDEFF3"
secondaryBackgroundColor = "#E7EAEF"
textColor = "#171C26"
borderColor = "#BFC6D0"
linkColor = "#0072B2"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFontWeights = [600, 600, 600]
headingFontSizes = ["22px", "16px", "14px"]
baseFontSize = 14
baseRadius = "4px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#1B2230"
secondaryBackgroundColor = "#2A3345"
textColor = "#C6CCD8"
borderColor = "#2F384A"
primaryColor = "#FFFFFF"
